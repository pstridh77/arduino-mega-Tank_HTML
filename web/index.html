<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arduino kontrollpanel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Arduino panel</h1>
    <p>Anslut till Arduino Mega via USB och styr motor och nivåreglering.</p>

    <div class="controls">
      <button id="connectButton" type="button">Anslut Arduino</button>

      <section class="panel-section" aria-labelledby="motorTitle">
        <div class="section-heading">
          <h2 id="motorTitle">Motorhastighet</h2>
          <output id="motorPwmValue" for="motorPwm">0</output>
        </div>
        <input id="motorPwm" type="range" min="0" max="255" value="0" aria-label="Motor PWM" disabled>
        <div class="potentiometer-reading">
          <span>Potentiometer A2</span>
          <output id="potentiometerValue" aria-live="polite">-- / 1023</output>
          <span>PWM: <output id="potentiometerPwm">-- / 255</output></span>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="controlModeTitle">
        <h2 id="controlModeTitle">Reglerläge</h2>
        <label for="controlMode">Välj reglering</label>
        <select id="controlMode" disabled>
          <option value="off" selected>Off</option>
          <option value="manual">Manuell</option>
          <option value="on-off">On/Off-regulator</option>
          <option value="p">P-regulator</option>
          <option value="pi">PI-regulator</option>
        </select>
        <div id="onOffSettings" class="mode-settings" hidden>
          <label for="onOffHysteresis">Hysteres från önskad nivå</label>
          <div class="setting-control">
            <input id="onOffHysteresis" type="number" min="0" max="250" step="1" value="10" disabled>
            <span>mm</span>
          </div>
          <label for="onOffPwm">Pumpens effekt</label>
          <div class="setting-control">
            <input id="onOffPwm" type="number" min="0" max="255" step="1" value="180" disabled>
            <span>PWM</span>
          </div>
          <button id="sendOnOffSettingsButton" type="button" disabled>Ställ in On/Off</button>
        </div>
        <div id="pSettings" class="mode-settings" hidden>
          <label for="pGain">Förstärkning K</label>
          <div class="setting-control">
            <input id="pGain" type="number" min="0" max="10" step="0.2" value="1.0" disabled>
            <span>K</span>
          </div>
          <button id="sendPSettingsButton" type="button" disabled>Ställ in P-regulator</button>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="levelTitle">
        <h2 id="levelTitle">Nivåreglering</h2>
        <div class="level-values">
          <div class="level-reading measured">
            <span>Uppmätt</span>
            <div><output id="measuredLevel" aria-live="polite">--</output> mm</div>
          </div>
          <div class="level-reading desired">
            <span>Önskad</span>
            <div><output id="desiredLevelDisplay">--</output> mm</div>
          </div>
          <div class="level-reading error">
            <span>Fel</span>
            <div><output id="levelError">--</output> mm</div>
          </div>
        </div>
        <label for="desiredLevel">Önskad nivå</label>
        <div class="setpoint-control">
          <input id="desiredLevel" type="number" min="0" max="500" step="1" value="250" disabled>
          <span>mm</span>
          <button id="sendSetpointButton" type="button" disabled>Ställ in</button>
        </div>
        <div class="chart-toolbar">
          <div class="chart-legend" aria-label="Förklaring till grafen">
            <span><i class="measured"></i>Uppmätt</span>
            <span><i class="desired"></i>Önskad</span>
            <span><i class="error"></i>Fel (högerskala)</span>
          </div>
          <button id="toggleChartButton" class="chart-toggle" type="button" aria-pressed="false">Pausa graf</button>
        </div>
        <div class="level-chart">
          <canvas id="levelChart" role="img" aria-label="Uppmätt nivå, önskad nivå och reglerfel under de senaste 60 sekunderna"></canvas>
        </div>
      </section>

      <p id="status" class="status">Inte ansluten.</p>
    </div>
  </main>

  <script>
    const connectButton = document.querySelector("#connectButton");
    const motorPwm = document.querySelector("#motorPwm");
    const motorPwmValue = document.querySelector("#motorPwmValue");
    const potentiometerValue = document.querySelector("#potentiometerValue");
    const potentiometerPwm = document.querySelector("#potentiometerPwm");
    const controlMode = document.querySelector("#controlMode");
    const onOffSettings = document.querySelector("#onOffSettings");
    const onOffHysteresis = document.querySelector("#onOffHysteresis");
    const onOffPwm = document.querySelector("#onOffPwm");
    const sendOnOffSettingsButton = document.querySelector("#sendOnOffSettingsButton");
    const pSettings = document.querySelector("#pSettings");
    const pGain = document.querySelector("#pGain");
    const sendPSettingsButton = document.querySelector("#sendPSettingsButton");
    const measuredLevel = document.querySelector("#measuredLevel");
    const desiredLevelDisplay = document.querySelector("#desiredLevelDisplay");
    const levelError = document.querySelector("#levelError");
    const desiredLevel = document.querySelector("#desiredLevel");
    const sendSetpointButton = document.querySelector("#sendSetpointButton");
    const levelChart = document.querySelector("#levelChart");
    const levelChartContext = levelChart.getContext("2d");
    const toggleChartButton = document.querySelector("#toggleChartButton");
    const statusText = document.querySelector("#status");

    const serialControls = [
      motorPwm,
      controlMode,
      onOffHysteresis,
      onOffPwm,
      sendOnOffSettingsButton,
      pGain,
      sendPSettingsButton,
      desiredLevel,
      sendSetpointButton,
    ];

    let port;
    let writer;
    let chartPaused = false;
    let pausedChartTime = 0;
    const levelHistory = [];
    const chartTimeSpanMs = 60000;
    const chartMaxLevel = 500;

    function drawLevelChart() {
      const pixelRatio = window.devicePixelRatio || 1;
      const width = levelChart.clientWidth;
      const height = levelChart.clientHeight;
      const requiredWidth = Math.round(width * pixelRatio);
      const requiredHeight = Math.round(height * pixelRatio);

      if (levelChart.width !== requiredWidth || levelChart.height !== requiredHeight) {
        levelChart.width = requiredWidth;
        levelChart.height = requiredHeight;
      }

      levelChartContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      levelChartContext.clearRect(0, 0, width, height);

      const plot = { left: 42, top: 10, right: width - 42, bottom: height - 24 };
      const plotWidth = plot.right - plot.left;
      const plotHeight = plot.bottom - plot.top;
      const now = chartPaused ? pausedChartTime : performance.now();

      levelChartContext.font = "11px Segoe UI, sans-serif";
      levelChartContext.lineWidth = 1;
      levelChartContext.textBaseline = "middle";

      for (let level = 0; level <= chartMaxLevel; level += 100) {
        const y = plot.bottom - (level / chartMaxLevel) * plotHeight;
        levelChartContext.strokeStyle = "#ded5c3";
        levelChartContext.beginPath();
        levelChartContext.moveTo(plot.left, y);
        levelChartContext.lineTo(plot.right, y);
        levelChartContext.stroke();
        levelChartContext.fillStyle = "#6b665b";
        levelChartContext.textAlign = "right";
        levelChartContext.fillText(String(level), plot.left - 7, y);
        levelChartContext.textAlign = "left";
        levelChartContext.fillText(String(level * 2 - 500), plot.right + 7, y);
      }

      for (let secondsAgo = 0; secondsAgo <= 60; secondsAgo += 10) {
        const x = plot.right - (secondsAgo / 60) * plotWidth;
        levelChartContext.strokeStyle = "#ded5c3";
        levelChartContext.beginPath();
        levelChartContext.moveTo(x, plot.top);
        levelChartContext.lineTo(x, plot.bottom);
        levelChartContext.stroke();
      }

      levelChartContext.textBaseline = "alphabetic";
      levelChartContext.fillStyle = "#6b665b";
      levelChartContext.textAlign = "left";
      levelChartContext.fillText("-60 s", plot.left, height - 5);
      levelChartContext.textAlign = "right";
      levelChartContext.fillText("nu", plot.right, height - 5);

      if (levelHistory.length > 0) {
        levelChartContext.save();
        levelChartContext.beginPath();
        levelChartContext.rect(plot.left, plot.top, plotWidth, plotHeight);
        levelChartContext.clip();
        levelChartContext.lineWidth = 2;
        levelChartContext.lineJoin = "round";

        function drawSeries(property, color, minimum, maximum) {
          levelChartContext.strokeStyle = color;
          levelChartContext.beginPath();

          levelHistory.forEach((sample, index) => {
            const x = plot.right - ((now - sample.time) / chartTimeSpanMs) * plotWidth;
            const boundedValue = Math.min(maximum, Math.max(minimum, sample[property]));
            const y = plot.bottom - ((boundedValue - minimum) / (maximum - minimum)) * plotHeight;

            if (index === 0) {
              levelChartContext.moveTo(x, y);
            } else {
              levelChartContext.lineTo(x, y);
            }
          });

          levelChartContext.stroke();
        }

        drawSeries("measured", "#24745f", 0, chartMaxLevel);
        drawSeries("desired", "#2463a0", 0, chartMaxLevel);
        drawSeries("error", "#b4492f", -chartMaxLevel, chartMaxLevel);
        levelChartContext.restore();
      }

      requestAnimationFrame(drawLevelChart);
    }

    drawLevelChart();

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle("error", isError);
    }

    async function sendCommand(command) {
      if (!writer) {
        return;
      }

      await writer.write(new TextEncoder().encode(`${command}\n`));
    }

    function handleSerialLine(line) {
      if (line === "READY") {
        sendCommand("LCD:FMTS|Ready").catch((error) => {
          setStatus(`Kunde inte bekräfta webbanslutningen: ${error.message}`, true);
        });
        sendCommand(`MODE:${controlMode.value}`).catch((error) => {
          setStatus(`Kunde inte välja reglerläge: ${error.message}`, true);
        });
        return;
      }

      if (!line.startsWith("LEVEL:")) {
        if (line.startsWith("POT:")) {
          const values = line.substring(4).split("|").map(Number);

          if (values.length === 2 && values.every(Number.isFinite)) {
            potentiometerValue.value = `${values[0]} / 1023`;
            potentiometerPwm.value = `${values[1]} / 255`;

            if (controlMode.value === "manual") {
              motorPwm.value = values[1];
              motorPwmValue.value = values[1];
            }
          }
        }
        return;
      }

      const values = line.substring(6).split("|").map(Number);
      if (values.length === 1 && Number.isFinite(values[0])) {
        const measured = values[0];
        const desired = Number(desiredLevel.value);
        const error = desired - measured;

        updateLevelValues(measured, desired, error);
      } else if (values.length === 3 && values.every(Number.isFinite)) {
        updateLevelValues(values[0], values[1], values[2]);
      }
    }

    function updateLevelValues(measured, desired, error) {
        measuredLevel.value = measured.toFixed(1);
        desiredLevelDisplay.value = desired.toFixed(1);
        levelError.value = error.toFixed(1);

        if (chartPaused) {
          return;
        }

        const now = performance.now();
        levelHistory.push({ time: now, measured, desired, error });

        while (levelHistory.length > 0 && levelHistory[0].time < now - chartTimeSpanMs) {
          levelHistory.shift();
        }
    }

    async function readSerialMessages() {
      const reader = port.readable.getReader();
      const decoder = new TextDecoder();
      let receivedText = "";

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }

          receivedText += decoder.decode(value, { stream: true });
          const lines = receivedText.split("\n");
          receivedText = lines.pop();
          lines.forEach((line) => handleSerialLine(line.trim()));
        }
      } finally {
        reader.releaseLock();
      }
    }

    async function sendMotorPwm() {
      await sendCommand(`MOTOR:${motorPwm.value}`);
      setStatus(`Motor PWM: ${motorPwm.value}.`);
    }

    async function sendDesiredLevel() {
      if (!desiredLevel.reportValidity()) {
        return;
      }

      desiredLevelDisplay.value = Number(desiredLevel.value).toFixed(1);
      await sendCommand(`SETPOINT:${desiredLevel.value}`);
      setStatus(`Önskad nivå skickad: ${desiredLevel.value} mm.`);
    }

    async function sendControlMode() {
      await sendCommand(`MODE:${controlMode.value}`);
      setStatus(`Reglerläge valt: ${controlMode.options[controlMode.selectedIndex].text}.`);
    }

    function updateOnOffSettingsVisibility() {
      onOffSettings.hidden = controlMode.value !== "on-off";
    }

    async function sendOnOffSettings() {
      if (!onOffHysteresis.reportValidity() || !onOffPwm.reportValidity()) {
        return;
      }

      await sendCommand(`ONOFF:${onOffHysteresis.value}|${onOffPwm.value}`);
      setStatus("On/Off-inställningar skickade.");
    }

    function updatePSettingsVisibility() {
      pSettings.hidden = controlMode.value !== "p";
    }

    async function sendPSettings() {
      if (!pGain.reportValidity()) {
        return;
      }

      await sendCommand(`PGAIN:${pGain.value}`);
      setStatus(`P-regulatorns K är ${Number(pGain.value).toFixed(1)}.`);
    }

    connectButton.addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        setStatus("Web Serial stöds i Chrome eller Edge.", true);
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        readSerialMessages().catch((error) => {
          setStatus(`Kunde inte läsa mätvärdet: ${error.message}`, true);
        });
        await sendCommand("LCD:FMTS|Ready");
        setTimeout(() => {
          sendCommand("LCD:FMTS|Ready").catch((error) => {
            setStatus(`Kunde inte uppdatera LCD-status: ${error.message}`, true);
          });
        }, 1500);
        serialControls.forEach((control) => {
          control.disabled = false;
        });
        connectButton.disabled = true;
        setStatus("Ansluten. Vänta någon sekund efter anslutning om kortet startar om.");
      } catch (error) {
        setStatus(`Kunde inte ansluta: ${error.message}`, true);
      }
    });

    motorPwm.addEventListener("input", () => {
      motorPwmValue.value = motorPwm.value;
    });

    controlMode.addEventListener("change", async () => {
      updateOnOffSettingsVisibility();
      updatePSettingsVisibility();
      try {
        await sendControlMode();
      } catch (error) {
        setStatus(`Kunde inte välja reglerläge: ${error.message}`, true);
      }
    });

    sendPSettingsButton.addEventListener("click", async () => {
      sendPSettingsButton.disabled = true;

      try {
        await sendPSettings();
      } catch (error) {
        setStatus(`Kunde inte ställa in P-regulatorn: ${error.message}`, true);
      } finally {
        sendPSettingsButton.disabled = false;
      }
    });

    sendOnOffSettingsButton.addEventListener("click", async () => {
      sendOnOffSettingsButton.disabled = true;

      try {
        await sendOnOffSettings();
      } catch (error) {
        setStatus(`Kunde inte ställa in On/Off-regulatorn: ${error.message}`, true);
      } finally {
        sendOnOffSettingsButton.disabled = false;
      }
    });

    updateOnOffSettingsVisibility();
    updatePSettingsVisibility();

    toggleChartButton.addEventListener("click", () => {
      chartPaused = !chartPaused;
      toggleChartButton.setAttribute("aria-pressed", String(chartPaused));

      if (chartPaused) {
        pausedChartTime = performance.now();
        toggleChartButton.textContent = "Återuppta graf";
      } else {
        levelHistory.length = 0;
        toggleChartButton.textContent = "Pausa graf";
      }
    });

    sendSetpointButton.addEventListener("click", async () => {
      sendSetpointButton.disabled = true;

      try {
        await sendDesiredLevel();
      } catch (error) {
        setStatus(`Kunde inte ställa in önskad nivå: ${error.message}`, true);
      } finally {
        sendSetpointButton.disabled = false;
      }
    });

    motorPwm.addEventListener("change", async () => {
      try {
        await sendMotorPwm();
      } catch (error) {
        setStatus(`Kunde inte styra motorn: ${error.message}`, true);
      }
    });

  </script>
</body>
</html>
