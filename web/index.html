<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arduino LED-kontroll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Arduino LED</h1>
    <p>Anslut till Arduino Mega via USB och styr den inbyggda LED:en.</p>

    <div class="controls">
      <button id="connectButton" type="button">Anslut Arduino</button>

      <div class="switch-row">
        <label for="ledSwitch">Inbyggd LED</label>
        <label class="switch" aria-label="Styr inbyggd LED">
          <input id="ledSwitch" type="checkbox" disabled>
          <span class="slider"></span>
        </label>
      </div>

      <p id="status" class="status">Inte ansluten.</p>
    </div>
  </main>

  <script>
    const connectButton = document.querySelector("#connectButton");
    const ledSwitch = document.querySelector("#ledSwitch");
    const statusText = document.querySelector("#status");

    let port;
    let writer;

    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle("error", isError);
    }

    async function sendLedState(isOn) {
      if (!writer) {
        return;
      }

      const command = isOn ? "1" : "0";
      await writer.write(new TextEncoder().encode(command));
      setStatus(isOn ? "LED tänd." : "LED släckt.");
    }

    connectButton.addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        setStatus("Web Serial stöds i Chrome eller Edge.", true);
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        ledSwitch.disabled = false;
        connectButton.disabled = true;
        setStatus("Ansluten. Vänta någon sekund efter anslutning om kortet startar om.");
      } catch (error) {
        setStatus(`Kunde inte ansluta: ${error.message}`, true);
      }
    });

    ledSwitch.addEventListener("change", async () => {
      ledSwitch.disabled = true;

      try {
        await sendLedState(ledSwitch.checked);
      } catch (error) {
        setStatus(`Kunde inte skicka kommando: ${error.message}`, true);
      } finally {
        ledSwitch.disabled = false;
      }
    });
  </script>
</body>
</html>
